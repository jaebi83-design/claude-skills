{% extends "base.html" %}
{% block title %}Upload - Video Decomposer{% endblock %}
{% block content %}
<h1>Upload Video</h1>

<div class="upload-card">
    <form id="upload-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="video-file">Select a video file</label>
            <input type="file" id="video-file" name="file" accept="video/*" required>
        </div>
        <div class="form-group">
            <label for="frame-interval">Frame sample interval (seconds)</label>
            <input type="number" id="frame-interval" value="1.0" min="0.25" max="10" step="0.25">
            <small>How often to sample frames for text detection. Lower = more accurate but slower.</small>
        </div>
        <button type="submit" class="btn btn-primary" id="upload-btn">Upload &amp; Decompose</button>
    </form>
    <div id="upload-status" class="status-message" style="display:none;"></div>
    <div id="progress-bar-container" style="display:none;">
        <div class="progress-bar">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <span id="progress-text">Uploading...</span>
    </div>
</div>
{% endblock %}
